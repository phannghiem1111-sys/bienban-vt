<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra kết nối</title>
<style>body{font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px;background:#f4f6f9;color:#1b2430}h1{font-size:18px}.r{background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:10px 12px;margin:8px 0}.ok{color:#1e7b3c;font-weight:700}.bad{color:#b42318;font-weight:700}small{color:#5d6b7c;word-break:break-all}button{padding:10px 16px;font:inherit;border:0;border-radius:8px;background:#d0121b;color:#fff}</style></head>
<body>
<h1>Kiểm tra kết nối Biên Bản Vật Tư MN</h1>
<p>Mở trang này bằng đúng trình duyệt đang bị lỗi (Safari, Zalo, Cốc Cốc…), bấm nút, rồi chụp màn hình gửi cho em.</p>
<button id="go">Bấm để kiểm tra</button>
<div id="out"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwV4J-5M2mfHL3y2aW2GdBss1sCftq-0Pcs1hKJ3UmPDw53GEMVEHnPeAn0ezMJzho6eQ/exec';
var out = document.getElementById('out');
function row(name, ok, detail) { var d = document.createElement('div'); d.className = 'r'; d.innerHTML = '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✔' : '✘') + '</span> ' + name + (detail ? '<br><small></small>' : ''); if (detail) d.querySelector('small').textContent = detail; out.appendChild(d); }
document.getElementById('go').onclick = function () {
  out.innerHTML = '';
  row('Trình duyệt', true, navigator.userAgent);
  var ls = false; try { localStorage.setItem('kt', '1'); ls = localStorage.getItem('kt') === '1'; localStorage.removeItem('kt'); } catch (e) {}
  row('Lưu đăng nhập (localStorage)', ls, ls ? '' : 'Bị chặn: bật lưu dữ liệu trang web hoặc tắt chế độ riêng tư');
  row('Có fetch / Promise', typeof fetch === 'function' && typeof Promise === 'function', '');
  var t0 = Date.now();
  fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'ping', args: [] }) })
    .then(function (r) { return r.text().then(function (t) { row('Gửi dữ liệu tới máy chủ (POST)', r.ok && /"ok":true/.test(t), 'HTTP ' + r.status + ' · ' + (Date.now() - t0) + ' ms · ' + t.slice(0, 160)); }); })
    .catch(function (e) { row('Gửi dữ liệu tới máy chủ (POST)', false, e.name + ': ' + e.message); })
    .then(function () {
      var t1 = Date.now();
      return fetch(API_URL + '?ping=1').then(function (r) { return r.text().then(function (t) { row('Hỏi máy chủ (GET)', r.ok && /"ok":true/.test(t), 'HTTP ' + r.status + ' · ' + (Date.now() - t1) + ' ms · ' + t.slice(0, 160)); }); })
        .catch(function (e) { row('Hỏi máy chủ (GET)', false, e.name + ': ' + e.message); });
    });
};
</script></body></html>
